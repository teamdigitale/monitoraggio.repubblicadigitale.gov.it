name: CodeQL

on:
  push:
    branches:
      - develop
      - test
      - main
    paths-ignore:
      - '**.md'
      - 'facilita-docs/**'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Su push consecutivi sullo stesso branch, mantieni solo l'ultimo run:
# CodeQL scansiona lo stato HEAD, non ha senso accumulare run obsoleti.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fe-piattaforma: ${{ steps.filter.outputs.fe-piattaforma }}
      lib-repdgt-shared: ${{ steps.filter.outputs.lib-repdgt-shared }}
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Clone completo: evita 'fatal: shallow file has changed' quando
        # dorny/paths-filter tenta di approfondire la storia per il diff base.
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fe-piattaforma:
              - 'fe-piattaforma/**'
            lib-repdgt-shared:
              - 'lib-repdgt-shared/**'
            ms-ente:
              - 'ms-ente/**'
            ms-gestione-utente:
              - 'ms-gestione-utente/**'
            ms-notifiche-integration:
              - 'ms-notifiche-integration/**'
            ms-open-data:
              - 'ms-open-data/**'
            ms-programma-progetto:
              - 'ms-programma-progetto/**'
            ms-questionario-cittadino:
              - 'ms-questionario-cittadino/**'

  fe-piattaforma-Analyze:
    needs: changes
    if: ${{ needs.changes.outputs.fe-piattaforma == 'true' }}
    name: Analyze fe-piattaforma
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'
          # queries: security-extended,security-and-quality

      - name: fe-piattaforma Build
        run: |
          cd ${{ github.workspace }}/fe-piattaforma
          npm install --legacy-peer-deps
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  lib-repdgt-shared-Analyze:
    needs: changes
    if: ${{ needs.changes.outputs.lib-repdgt-shared == 'true' }}
    name: Analyze lib-repdgt-shared
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'java'
          # queries: security-extended,security-and-quality

      - name: lib-repdgt-shared Compilation
        run: |
          cd ${{ github.workspace }}/lib-repdgt-shared
          mvn -DskipTests install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  ms-Analyze:
    needs: changes
    if: ${{ needs.changes.outputs.changes != '' && needs.changes.outputs.changes != '[]' }}
    name: Analyze ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module:
          - ms-ente
          - ms-gestione-utente
          - ms-notifiche-integration
          - ms-open-data
          - ms-programma-progetto
          - ms-questionario-cittadino

    steps:
      - name: Skip if module not changed
        id: skipcheck
        run: |
          if echo '${{ needs.changes.outputs.changes }}' | grep -q '"${{ matrix.module }}"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Modulo ${{ matrix.module }} non modificato, skip."
          fi

      - name: Checkout repository
        if: steps.skipcheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: steps.skipcheck.outputs.run == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: 'java'
          # queries: security-extended,security-and-quality

      - name: lib-repdgt-shared Compilation
        if: steps.skipcheck.outputs.run == 'true'
        run: |
          cd ${{ github.workspace }}/lib-repdgt-shared
          mvn -DskipTests install

      - name: ${{ matrix.module }} Build
        if: steps.skipcheck.outputs.run == 'true'
        run: |
          cd ${{ github.workspace }}/${{ matrix.module }}
          mvn -DskipTests package

      - name: Perform CodeQL Analysis
        if: steps.skipcheck.outputs.run == 'true'
        uses: github/codeql-action/analyze@v3
