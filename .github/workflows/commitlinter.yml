name: Commitlint

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

# Su push consecutivi sullo stesso branch tieni solo l'ultimo run.
concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
