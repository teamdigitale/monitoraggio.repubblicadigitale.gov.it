server.port=${SERVER_PORT:8081}
spring.application.name=estrazione-schede-cittadino

# ============================================================
# MySQL (copia dell'istanza in uso) - vista vw_primo_servizio_cittadino
# Su Azure Database for MySQL il TLS e' obbligatorio: in MYSQL_URL usare
# sslMode=REQUIRED (vedi .env.prod.example) al posto di useSSL=false.
# ============================================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/facilita?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# La vista e' read-only: non lasciare che Hibernate tocchi lo schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================
# MongoDB (copia dell'istanza in uso) - collection questionarioTemplateIstanza
# ============================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/facilita}

# ============================================================
# Chiave per l'hash del codice fiscale (SHA-256): deve coincidere con
# quella usata per popolare la vista, altrimenti la ricerca per CF in chiaro
# non trova nulla. La ricerca per hash o per id non la usa.
# ============================================================
logging.level.it.pa.repdgt.estrazione=INFO
